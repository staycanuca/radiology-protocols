site_name: Ghidul Protocoalelor de Radiologie
site_url: https://dfergs93.github.io/radiology-protocols/

theme:
  name: material
  language: ro
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.tabs
    # - navigation.expand
    # - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.integrate
  palette:
    # Mod luminos (Implicit - sinonim cu panoul de administrare)
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Comută la modul întunecat

    # Mod întunecat (Opțional)
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Comută la modul luminos
    
plugins:
  - search
  - awesome-pages

hooks:
  # Normalize search terms and keep RX navigation/catalog ordering consistent.
  - scripts/search_enhancer.py
  - scripts/rx_catalog.py

extra_css:
  - custom_css/extra.css

extra_javascript:
  - javascripts/acquisition-diagram.js
  - javascripts/acquisition-diagram-init.js
  - https://cdn.jsdelivr.net/npm/marked/marked.min.js
  - javascripts/protocol-compare.js
  - javascripts/request-change.js
  - javascripts/iris-data.js
  - javascripts/iris-browser.js
  - javascripts/ai-assistant.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
